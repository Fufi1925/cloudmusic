import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

// version comes from the electron app's package.json (single source of truth)
def pkg = new JsonSlurper().parse(file("../../package.json"))
def appVersion = pkg.version as String
def parts = appVersion.tokenize('.').collect { it.replaceAll('[^0-9]', '') ?: '0' }.collect { it as int }
while (parts.size() < 3) parts << 0
def appVersionCode = parts[0] * 1000000 + parts[1] * 1000 + parts[2]

// optional release signing: android/keystore.properties (storeFile, storePassword, keyAlias, keyPassword)
def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.hkamori.liner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hkamori.liner'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersion
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/versions/**', 'DebugProbesKt.bin', 'kotlin/**']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media:media:1.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
}
